    <script>
      (function() {
        const log = document.getElementById('devbar-logs');
        const colors = { log: '#e5e7eb', warn: '#fbbf24', error: '#f87171', info: '#60a5fa' };
        function capture(level) {
          const orig = console[level].bind(console);
          console[level] = (...args) => {
            orig(...args);
            const line = document.createElement('div');
            line.style.cssText = `color:${colors[level]};padding:1px 0;white-space:pre-wrap;word-break:break-all;`;
            line.textContent = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
          };
        }
        ['log','warn','error','info'].forEach(capture);
        window.addEventListener('unhandledrejection', e => console.error('Unhandled rejection:', e.reason));
      })();
    </script>

      /* ── MCP tool calls ─────────────────────────────────────────────── */

      function unwrapMcp(res) {
        // Response shape: { content: [{ type: "text", text: "<json string>" }] }
        const text = res?.content?.[0]?.text;
        if (text) return JSON.parse(text);
        return res?.result ?? res;
      }

      async function list_jobs() {
        console.log("[cowork] list_jobs: calling MCP tool");
        const res = await window.cowork.callMcpTool("mcp__careerplug__list_jobs", {
          per_page: 50,
          sort_by: "jobs.created_at",
          sort_direction: "DESC",
        });
        console.log("[cowork] list_jobs raw response:", res);
        const data = unwrapMcp(res) ?? [];
        console.log("[cowork] list_jobs resolved:", data);
        return data;
      }

      async function list_applicants(jobId) {
        console.log("[cowork] list_applicants: calling for job", jobId);
        const res = await window.cowork.callMcpTool("mcp__careerplug__list_applicants", {
          job_ids: [parseInt(jobId)],
          status: "active",
          per_page: 50,
          sort_by: "date-desc",
        });
        console.log("[cowork] list_applicants raw response:", res);
        const data = unwrapMcp(res) ?? [];
        console.log("[cowork] list_applicants resolved:", data);
        return data;
      }

      async function get_applicant_details(id) {
        const res = await window.cowork.callMcpTool("mcp__careerplug__get_applicant_details", {
          app_id: parseInt(id),
        });
        return unwrapMcp(res);
      }

      let JOBS = [];
      let APPLICANTS = [];

      /* ── State ───────────────────────────────────────────────────────── */

      let selectedJobId = null;
      let showStarred = false;
      let sortCol = null;
      let sortDir = 1; // 1 = asc, -1 = desc
      let filterQ = "";
      let filterStage = "all";
      const starred = new Set();

      /* ── Helpers ─────────────────────────────────────────────────────── */

      function shortTitle(title) {
        return title.replace(/ - (Full|Part) Time/g, "");
      }

      function getDetail(name) {
        if (!USE_FAKE_DATA) return null;
        return FAKE_APPLICANT_DETAILS.find(
          (d) => d.name.toLowerCase() === name.toLowerCase(),
        ) ?? null;
      }

      function getApplicantsForJob(jobId) {
        return APPLICANTS.filter((a) => a.job_url === `/manage/jobs/${jobId}`);
      }

      const icons = {
        starOutline: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg>`,
        starSolid: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd"/></svg>`,
        magnifying: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>`,
        briefcase: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0M12 12.75h.008v.008H12v-.008Z"/></svg>`,
      };

      /* ── Render ───────────────────────────────────────────────────────── */

      function renderSidebar() {
        const active = JOBS.filter((j) => j.status === "Active");

        const jobRow = (j) => `
        <div
          class="flex items-center justify-between px-3 py-2 cursor-pointer gap-2 ${j.id === selectedJobId ? "bg-gray-100 font-medium" : "hover:bg-gray-50"}"
          onclick="selectJob('${j.id}')"
        >
          <span class="truncate text-gray-700">${shortTitle(j.title)}</span>
          <span class="text-xs text-gray-400 shrink-0">${j.applicant_count}</span>
        </div>
      `;

        document.getElementById("sidebar").innerHTML = `
        <div class="px-4 py-3 border-b font-semibold text-gray-800">Claude Cowork</div>
        <div class="overflow-y-auto flex-1">
          <div
            class="flex items-center justify-between px-3 py-2 cursor-pointer gap-2 ${showStarred ? "bg-gray-100 font-medium" : "hover:bg-gray-50"}"
            onclick="selectStarred()"
          >
            <span class="flex items-center gap-2 text-yellow-500">${icons.starSolid}<span class="text-gray-700">Starred</span></span>
            <span class="text-xs text-gray-400 shrink-0">${starred.size}</span>
          </div>
          ${active.map(jobRow).join("")}
        </div>
      `;
      }

      function renderMain() {
        const main = document.getElementById("main");

        if (showStarred) {
          renderStarred();
          return;
        }

        if (!selectedJobId) {
          main.innerHTML = `<p class="text-gray-400">Select a job to view applicants.</p>`;
          return;
        }

        const job = JOBS.find((j) => j.id === selectedJobId);
        const applicants = getApplicantsForJob(selectedJobId);

        const gradeOrder = { A: 0, B: 1, C: 2, D: 3 };
        const gradeColors = {
          A: "text-emerald-600",
          B: "text-amber-500",
          C: "text-orange-500",
          D: "text-gray-400",
        };

        const columns = [
          { key: "name", label: "Applicant", val: (a, d) => a.name },
          {
            key: "grade",
            label: "Grade",
            val: (a, d) => gradeOrder[d?.grade] ?? 99,
          },
          { key: "yoe", label: "YOE", val: (a, d) => d?.yoe ?? -1 },
          {
            key: "skills",
            label: "Skills",
            val: (a, d) => d?.skills?.[0] ?? "",
          },
          {
            key: "stage",
            label: "Stage",
            val: (a, d) => d?.current_step ?? a.current_step,
          },
          {
            key: "source",
            label: "Source",
            val: (a, d) => d?.applied_via ?? "",
          },
          {
            key: "applied",
            label: "Applied",
            val: (a, d) => d?.applied_date ?? "",
          },
        ];

        let rows = applicants.map((a) => ({ a, d: getDetail(a.name) }));

        if (filterQ) {
          const q = filterQ.toLowerCase();
          rows = rows.filter(
            ({ a, d }) =>
              a.name.toLowerCase().includes(q) ||
              d?.skills?.some((s) => s.toLowerCase().includes(q)) ||
              (d?.applied_via ?? "").toLowerCase().includes(q),
          );
        }

        if (filterStage !== "all") {
          rows = rows.filter(
            ({ a, d }) => (d?.current_step ?? a.current_step) === filterStage,
          );
        }

        if (sortCol) {
          const col = columns.find((c) => c.key === sortCol);
          rows.sort((x, y) => {
            const av = col.val(x.a, x.d),
              bv = col.val(y.a, y.d);
            return av < bv ? -sortDir : av > bv ? sortDir : 0;
          });
        }

        const thClass = (key) => {
          const active = sortCol === key;
          return `pb-2 pr-4 font-medium cursor-pointer select-none hover:text-gray-700 ${active ? "text-gray-800" : ""}`;
        };
        const arrow = (key) =>
          sortCol === key ? (sortDir === 1 ? " ↑" : " ↓") : "";

        const rowsHtml = rows
          .map(({ a, d }) => {
            const grade = d?.grade ?? "—";
            const gradeClass = gradeColors[grade] ?? "text-gray-400";
            const skills = d?.skills ? d.skills.slice(0, 2).join(", ") : "—";
            const isStarred = starred.has(a.id);
            return `
          <tr class="border-t border-gray-100">
            <td class="py-2 pr-2 w-6">
              <button onclick="toggleStar('${a.id}')" class="flex items-center bg-transparent border-0 p-0 cursor-pointer ${isStarred ? "text-yellow-400" : "text-gray-300 hover:text-yellow-400"}">${isStarred ? icons.starSolid : icons.starOutline}</button>
            </td>
            <td class="py-2 pr-4 font-medium text-gray-800">${a.name}</td>
            <td class="py-2 pr-4 font-mono font-semibold ${gradeClass}">${grade}</td>
            <td class="py-2 pr-4 text-gray-500">${d?.yoe != null ? d.yoe + " yr" : "—"}</td>
            <td class="py-2 pr-4 text-gray-500">${skills}</td>
            <td class="py-2 pr-4 text-gray-500">${d?.current_step ?? a.current_step}</td>
            <td class="py-2 pr-4 text-gray-500">${d?.applied_via ?? "—"}</td>
            <td class="py-2 text-gray-500">${d?.applied_date ?? "—"}</td>
          </tr>
        `;
          })
          .join("");

        const stages = [
          "New Application",
          "First Interview",
          "Second Interview",
          "Send Offer",
          "Reference Check",
          "Background Check with ADP",
          "Hire",
        ];
        const stageLabel = {
          "New Application": "New",
          "First Interview": "1st Interview",
          "Second Interview": "2nd Interview",
          "Send Offer": "Offer",
          "Reference Check": "Reference",
          "Background Check with ADP": "Background",
          Hire: "Hire",
        };

        main.innerHTML = `
        <h1 class="text-base font-semibold text-gray-800 mb-1">${shortTitle(job.title)}</h1>
        <p class="text-xs text-gray-400 mb-6">${job.location} · ${applicants.length} applicant${applicants.length !== 1 ? "s" : ""}</p>

        <div class="flex items-center gap-3 mb-6">
          <div class="relative">
            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">${icons.magnifying}</span>
            <input
              id="search-input"
              type="text"
              placeholder="Search applicants..."
              value="${filterQ}"
              oninput="setFilter('q', this.value)"
              class="border border-gray-200 rounded pl-8 pr-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-gray-300 w-56"
            />
          </div>
          <div class="flex gap-1">
            <button onclick="setFilter('stage','all')" class="px-3 py-1.5 rounded text-xs border ${filterStage === "all" ? "bg-gray-800 text-white border-gray-800" : "border-gray-200 text-gray-600 hover:bg-gray-50"}">All</button>
            ${stages.map((s) => `<button onclick="setFilter('stage','${s}')" class="px-3 py-1.5 rounded text-xs border ${filterStage === s ? "bg-gray-800 text-white border-gray-800" : "border-gray-200 text-gray-600 hover:bg-gray-50"}">${stageLabel[s] ?? s}</button>`).join("")}
          </div>
        </div>

        <table class="w-full text-sm text-left">
          <thead>
            <tr class="text-xs text-gray-400 uppercase">
              <th class="pb-2 pr-2 w-6"></th>
              ${columns.map((c) => `<th class="${thClass(c.key)}" onclick="sortBy('${c.key}')">${c.label}${arrow(c.key)}</th>`).join("")}
            </tr>
          </thead>
          <tbody>${rowsHtml || `<tr><td colspan="8" class="py-6 text-center text-gray-400">No applicants yet.</td></tr>`}</tbody>
        </table>
      `;
      }

      function renderStarred() {
        const main = document.getElementById("main");
        const gradeColors = {
          A: "text-emerald-600",
          B: "text-amber-500",
          C: "text-orange-500",
          D: "text-gray-400",
        };
        const starredApplicants = APPLICANTS.filter((a) => starred.has(a.id));

        const rowsHtml = starredApplicants
          .map((a) => {
            const d = getDetail(a.name);
            const job = JOBS.find((j) => `/manage/jobs/${j.id}` === a.job_url);
            const grade = d?.grade ?? "—";
            const gradeClass = gradeColors[grade] ?? "text-gray-400";
            const skills = d?.skills ? d.skills.slice(0, 2).join(", ") : "—";
            return `
          <tr class="border-t border-gray-100">
            <td class="py-2 pr-2 w-6">
              <button onclick="toggleStar('${a.id}')" class="flex items-center bg-transparent border-0 p-0 cursor-pointer text-yellow-400 hover:text-gray-300">${icons.starSolid}</button>
            </td>
            <td class="py-2 pr-4 font-medium text-gray-800">${a.name}</td>
            <td class="py-2 pr-4 text-gray-500 text-xs truncate max-w-xs">${job ? shortTitle(job.title) : "—"}</td>
            <td class="py-2 pr-4 font-mono font-semibold ${gradeClass}">${grade}</td>
            <td class="py-2 pr-4 text-gray-500">${d?.yoe != null ? d.yoe + " yr" : "—"}</td>
            <td class="py-2 pr-4 text-gray-500">${skills}</td>
            <td class="py-2 pr-4 text-gray-500">${d?.current_step ?? a.current_step}</td>
            <td class="py-2 text-gray-500">${d?.applied_date ?? "—"}</td>
          </tr>
        `;
          })
          .join("");

        main.innerHTML = `
        <h1 class="text-base font-semibold text-gray-800 mb-6">Starred Candidates</h1>
        <table class="w-full text-sm text-left">
          <thead>
            <tr class="text-xs text-gray-400 uppercase">
              <th class="pb-2 pr-2 w-6"></th>
              <th class="pb-2 pr-4 font-medium">Applicant</th>
              <th class="pb-2 pr-4 font-medium">Job</th>
              <th class="pb-2 pr-4 font-medium">Grade</th>
              <th class="pb-2 pr-4 font-medium">YOE</th>
              <th class="pb-2 pr-4 font-medium">Skills</th>
              <th class="pb-2 pr-4 font-medium">Stage</th>
              <th class="pb-2 font-medium">Applied</th>
            </tr>
          </thead>
          <tbody>${rowsHtml || `<tr><td colspan="8" class="py-6 text-center text-gray-400">No starred candidates yet.</td></tr>`}</tbody>
        </table>
      `;
      }

      /* ── Actions ─────────────────────────────────────────────────────── */

      async function selectJob(jobId) {
        selectedJobId = jobId;
        showStarred = false;
        sortCol = null;
        sortDir = 1;
        filterQ = "";
        filterStage = "all";

        if (!USE_FAKE_DATA) {
          const fetched = await list_applicants(jobId);
          APPLICANTS = APPLICANTS.filter(
            (a) => a.job_url !== `/manage/jobs/${jobId}`,
          );
          APPLICANTS.push(...fetched);
        }

        renderSidebar();
        renderMain();
      }

      function selectStarred() {
        showStarred = true;
        selectedJobId = null;
        renderSidebar();
        renderMain();
      }

      function toggleStar(id) {
        if (starred.has(id)) starred.delete(id);
        else starred.add(id);
        renderSidebar();
        renderMain();
      }

      function setFilter(type, value) {
        if (type === "q") filterQ = value;
        else if (type === "stage") filterStage = value;
        renderMain();
        if (type === "q") {
          const input = document.getElementById("search-input");
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }
      }

      function sortBy(key) {
        if (sortCol === key) sortDir *= -1;
        else {
          sortCol = key;
          sortDir = 1;
        }
        renderMain();
      }

      /* ── Init ────────────────────────────────────────────────────────── */

      async function init() {
        console.log("[cowork] init: USE_FAKE_DATA =", USE_FAKE_DATA);
        console.log("[cowork] init: window.cowork =", window.cowork);
        if (USE_FAKE_DATA) {
          JOBS = FAKE_JOBS;
          APPLICANTS = FAKE_APPLICANTS;
        } else {
          try {
            JOBS = await list_jobs();
            console.log("[cowork] init: JOBS loaded, count =", JOBS.length);
          } catch (err) {
            console.error("[cowork] init: list_jobs threw:", err);
          }
        }
        renderSidebar();
        renderMain();
      }

      init();
    </script>
  </body>
</html>
